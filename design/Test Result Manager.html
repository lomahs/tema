document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

rue }}\">\n    <div style=\"display:flex; flex-direction:column; gap:4px\">\n      <div style=\"display:flex; justify-content:space-between; align-items:flex-start; gap:8px\">\n        <div style=\"font-size:15px; font-weight:700; letter-spacing:-0.01em\">Test Result Manager<\u002Fdiv>\n        <button sc-camel-on-click=\"{{ toggleSidebar }}\" title=\"Hide sidebar\" style=\"cursor:pointer; font:inherit; font-size:15px; line-height:1; color:#7E8791; background:transparent; border:0; padding:2px 4px; border-radius:5px; flex:none\" style-hover=\"color:#EDECE7;background:#242931\">«<\u002Fbutton>\n      <\u002Fdiv>\n      <div style=\"font-family:'IBM Plex Mono',monospace; font-size:11px; color:#7E8791; letter-spacing:0.04em\">READ-ONLY · IMPORT REFRESHES<\u002Fdiv>\n      <div style=\"margin-top:10px; padding:9px 11px; border-radius:7px; background:#1C2128; display:flex; flex-direction:column; gap:2px\">\n        <span style=\"font-size:10.5px; font-weight:600; letter-spacing:0.08em; text-transform:uppercase; color:#7E8791\">Today<\u002Fspan>\n        <span style=\"font-family:'IBM Plex Mono',monospace; font-size:13px; font-weight:500; color:#EDECE7\">{{ todayLabel }}<\u002Fspan>\n        <span style=\"font-size:11.5px; color:#7E8791\">{{ todayExec }}<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <nav style=\"display:flex; flex-direction:column; gap:2px\">\n      <button sc-camel-on-click=\"{{ goSummary }}\" style=\"text-align:left; border:0; cursor:pointer; font:inherit; font-size:13.5px; font-weight:500; color:#EDECE7; padding:9px 11px; border-radius:7px; display:flex; justify-content:space-between; align-items:center; background:{{ navSummary }}\" style-hover=\"background:#242931\">Summary<span style=\"font-family:'IBM Plex Mono',monospace; font-size:11px; color:#7E8791\">{{ totalCases }}<\u002Fspan><\u002Fbutton>\n      <button sc-camel-on-click=\"{{ goDaily }}\" style=\"text-align:left; border:0; cursor:pointer; font:inherit; font-size:13.5px; font-weight:500; color:#EDECE7; padding:9px 11px; border-radius:7px; background:{{ navDaily }}\" style-hover=\"background:#242931\">Daily Tracking<\u002Fbutton>\n      <button sc-camel-on-click=\"{{ goTeam }}\" style=\"text-align:left; border:0; cursor:pointer; font:inherit; font-size:13.5px; font-weight:500; color:#EDECE7; padding:9px 11px; border-radius:7px; background:{{ navTeam }}\" style-hover=\"background:#242931\">Productivity<\u002Fbutton>\n      <button sc-camel-on-click=\"{{ goIssues }}\" style=\"text-align:left; border:0; cursor:pointer; font:inherit; font-size:13.5px; font-weight:500; color:#EDECE7; padding:9px 11px; border-radius:7px; display:flex; justify-content:space-between; align-items:center; background:{{ navIssues }}\" style-hover=\"background:#242931\">Non-OK cases<span style=\"font-family:'IBM Plex Mono',monospace; font-size:11px; color:#C98A2B\">{{ nonOkCount }}<\u002Fspan><\u002Fbutton>\n      <button sc-camel-on-click=\"{{ goTools }}\" style=\"text-align:left; border:0; cursor:pointer; font:inherit; font-size:13.5px; font-weight:500; color:#EDECE7; padding:9px 11px; border-radius:7px; background:{{ navTools }}\" style-hover=\"background:#242931\">Tools<\u002Fbutton>\n    <\u002Fnav>\n\n    <div style=\"margin-top:auto; display:flex; flex-direction:column; gap:10px\">\n      <label style=\"display:block; cursor:pointer; background:#1F6F5C; color:#fff; font-size:13px; font-weight:600; padding:10px 12px; border-radius:7px; text-align:center\" style-hover=\"background:#25866F\">\n        Load files\n        <input type=\"file\" multiple=\"true\" accept=\".xlsx,.xls,.csv\" sc-camel-on-change=\"{{ onPickFiles }}\" style=\"display:none\">\n      <\u002Flabel>\n      <label style=\"display:block; cursor:pointer; border:1px solid #343A43; color:#C8CDD3; font-size:13px; font-weight:500; padding:9px 12px; border-radius:7px; text-align:center\" style-hover=\"border-color:#5B636D;color:#EDECE7\">\n        Load folder\n        <input type=\"file\" multiple=\"true\" sc-camel-on-change=\"{{ onPickFolder }}\" ref=\"{{ folderRef }}\" style=\"display:none\">\n      <\u002Flabel>\n      <div style=\"font-family:'IBM Plex Mono',monospace; font-size:11px; color:#6B7078; line-height:1.5\">{{ importStatus }}<\u002Fdiv>\n    <\u002Fdiv>\n    <\u002Fsc-if>\n  <\u002Faside>\n\n  <main style=\"padding:26px 30px 60px; display:flex; flex-direction:column; gap:20px; min-width:0\">\n\n    <header style=\"display:flex; flex-direction:column; gap:5px\">\n      <h1 style=\"margin:0; font-size:23px; font-weight:600; letter-spacing:-0.02em\">{{ viewTitle }}<\u002Fh1>\n      <div style=\"font-size:13px; color:#6B7078\">{{ viewSub }}<\u002Fdiv>\n    <\u002Fheader>\n\n    <!-- SUMMARY -->\n    <sc-if value=\"{{ isSummary }}\" hint-placeholder-val=\"{{ true }}\">\n      <div style=\"display:flex; flex-direction:column; gap:20px\">\n\n        <div style=\"display:grid; grid-template-columns:repeat(auto-fit,minmax(170px,1fr)); gap:12px\">\n          <sc-for list=\"{{ kpis }}\" as=\"k\" hint-placeholder-count=\"5\">\n            <div sc-camel-on-click=\"{{ k.onClick }}\" title=\"{{ k.hint }}\" style=\"background:#fff; border:1px solid #E4E2DC; border-radius:10px; padding:15px 16px; display:flex; flex-direction:column; gap:6px; cursor:{{ k.cursor }}\" style-hover=\"border-color:#C9C6BE\">\n              <div style=\"display:flex; justify-content:space-between; align-items:center; gap:6px\">\n                <span style=\"font-size:11px; font-weight:600; letter-spacing:0.07em; text-transform:uppercase; color:#6B7078\">{{ k.label }}<\u002Fspan>\n                <span style=\"font-size:11px; color:#1F6F5C; font-weight:600\">{{ k.action }}<\u002Fspan>\n              <\u002Fdiv>\n              <div style=\"font-family:'IBM Plex Mono',monospace; font-size:27px; font-weight:600; letter-spacing:-0.02em; color:{{ k.color }}\">{{ k.value }}<\u002Fdiv>\n              <div style=\"font-size:12px; color:#6B7078\">{{ k.sub }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n\n        <div style=\"display:grid; grid-template-columns:repeat(auto-fit,minmax(340px,1fr)); gap:16px\">\n          <section style=\"background:#fff; border:1px solid #E4E2DC; border-radius:10px; padding:18px 20px\">\n            <h2 style=\"margin:0 0 14px; font-size:14px; font-weight:600\">Result breakdown — all files<\u002Fh2>\n            <div style=\"display:flex; height:12px; border-radius:6px; overflow:hidden; background:#F2F1ED; margin-bottom:16px\">\n              <sc-for list=\"{{ statusRows }}\" as=\"s\" hint-placeholder-count=\"6\"><div style=\"background:{{ s.color }}; width:{{ s.pct }}\"><\u002Fdiv><\u002Fsc-for>\n            <\u002Fdiv>\n            <div style=\"display:flex; flex-direction:column; gap:9px\">\n              <sc-for list=\"{{ statusRows }}\" as=\"s\" hint-placeholder-count=\"6\">\n                <div style=\"display:grid; grid-template-columns:10px 1fr auto auto; gap:10px; align-items:center; font-size:13px\">\n                  <span style=\"width:10px; height:10px; border-radius:3px; background:{{ s.color }}\"><\u002Fspan>\n                  <span style=\"font-weight:500\">{{ s.label }}<\u002Fspan>\n                  <span style=\"font-family:'IBM Plex Mono',monospace; color:#6B7078; font-size:12px\">{{ s.pct }}<\u002Fspan>\n                  <span style=\"font-family:'IBM Plex Mono',monospace; font-weight:600; min-width:58px; text-align:right\">{{ s.count }}<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fsection>\n\n          <section style=\"background:#fff; border:1px solid #E4E2DC; border-radius:10px; padding:18px 20px\" data-comment-anchor=\"b548f2fa6f-section\">\n            <div style=\"display:flex; justify-content:space-between; align-items:baseline; margin-bottom:12px; gap:10px; flex-wrap:wrap\">\n              <h2 style=\"margin:0; font-size:14px; font-weight:600\">Today's progress<\u002Fh2>\n              <span style=\"font-family:'IBM Plex Mono',monospace; font-size:11.5px; color:#6B7078\">{{ todayHeadline }}<\u002Fspan>\n            <\u002Fdiv>\n            <sc-if value=\"{{ todayEmpty }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"font-size:13px; color:#6B7078; padding:8px 0 4px\">{{ todayEmptyText }}<\u002Fdiv>\n            <\u002Fsc-if>\n            <div style=\"display:flex; flex-direction:column; gap:0; max-height:240px; overflow-y:auto\">\n              <sc-for list=\"{{ todayRows }}\" as=\"r\" hint-placeholder-count=\"4\">\n                <div style=\"display:flex; flex-direction:column; gap:5px; padding:9px 0; border-bottom:1px solid #F4F3EF\">\n                  <div style=\"display:flex; justify-content:space-between; align-items:baseline; gap:10px\">\n                    <span style=\"font-weight:600; font-size:13px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap\">{{ r.file }}<\u002Fspan>\n                    <span style=\"font-family:'IBM Plex Mono',monospace; font-size:12.5px; font-weight:600; white-space:nowrap\">{{ r.total }}<\u002Fspan>\n                  <\u002Fdiv>\n                  <div style=\"display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap\">\n                    <span style=\"font-size:12px; color:#6B7078; overflow:hidden; text-overflow:ellipsis\">{{ r.pics }}<\u002Fspan>\n                    <div style=\"display:flex; gap:5px; flex-wrap:wrap\">\n                      <sc-for list=\"{{ r.chips }}\" as=\"c\" hint-placeholder-count=\"3\">\n                        <span style=\"display:inline-block; padding:2px 8px; border-radius:20px; font-size:10.5px; font-weight:600; background:{{ c.bg }}; color:{{ c.fg }}\">{{ c.label }}<\u002Fspan>\n                      <\u002Fsc-for>\n                    <\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fsection>\n        <\u002Fdiv>\n\n        <section style=\"background:#fff; border:1px solid #E4E2DC; border-radius:10px; overflow:hidden\">\n          <div style=\"padding:14px 20px; border-bottom:1px solid #E4E2DC; display:flex; flex-direction:column; gap:11px\">\n            <div style=\"display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap\">\n              <h2 style=\"margin:0; font-size:14px; font-weight:600\">Detail by test case file<\u002Fh2>\n              <div style=\"display:flex; align-items:center; gap:8px; flex-wrap:wrap\">\n                <sc-raw-select value=\"{{ scopeFilter }}\" sc-camel-on-change=\"{{ onScope }}\" style=\"font:inherit; font-size:12.5px; padding:6px 9px; border:1px solid #DFDDD6; border-radius:6px; background:#fff; color:#14171C\">\n                  <sc-for list=\"{{ scopeOptions }}\" as=\"o\" hint-placeholder-count=\"3\"><option value=\"{{ o.v }}\">{{ o.label }}<\u002Foption><\u002Fsc-for>\n                <\u002Fsc-raw-select>\n                <sc-raw-select value=\"{{ deviceFilter }}\" sc-camel-on-change=\"{{ onDevice }}\" style=\"font:inherit; font-size:12.5px; padding:6px 9px; border:1px solid #DFDDD6; border-radius:6px; background:#fff; color:#14171C\">\n                  <sc-for list=\"{{ deviceOptions }}\" as=\"o\" hint-placeholder-count=\"3\"><option value=\"{{ o.v }}\">{{ o.label }}<\u002Foption><\u002Fsc-for>\n                <\u002Fsc-raw-select>\n                <sc-raw-select value=\"{{ fileFilter }}\" sc-camel-on-change=\"{{ onFile }}\" style=\"font:inherit; font-size:12.5px; padding:6px 9px; border:1px solid #DFDDD6; border-radius:6px; background:#fff; color:#14171C; max-width:210px\">\n                  <sc-for list=\"{{ fileOptions }}\" as=\"o\" hint-placeholder-count=\"4\"><option value=\"{{ o.v }}\">{{ o.label }}<\u002Foption><\u002Fsc-for>\n                <\u002Fsc-raw-select>\n                <button sc-camel-on-click=\"{{ toggleGrouping }}\" style=\"cursor:pointer; font:inherit; font-size:12.5px; color:#14171C; background:#fff; border:1px solid #DFDDD6; padding:6px 11px; border-radius:6px; display:flex; align-items:center; gap:7px\" style-hover=\"border-color:#14171C\">\n                  <span style=\"font-size:11px; text-transform:uppercase; letter-spacing:0.05em; color:#6B7078\">Rows<\u002Fspan>{{ groupingLabel }}\n                <\u002Fbutton>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <sc-if value=\"{{ hasSummaryFilters }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"display:flex; gap:8px; align-items:center; flex-wrap:wrap\">\n                <span style=\"font-size:11px; font-weight:600; letter-spacing:0.06em; text-transform:uppercase; color:#6B7078\">Filtered<\u002Fspan>\n                <sc-for list=\"{{ summaryChips }}\" as=\"c\" hint-placeholder-count=\"2\">\n                  <button sc-camel-on-click=\"{{ c.onClear }}\" title=\"Remove filter\" style=\"cursor:pointer; font:inherit; font-size:12px; display:flex; align-items:center; gap:7px; background:#FAF9F6; color:#14171C; border:1px solid #DFDDD6; padding:4px 10px; border-radius:20px\" style-hover=\"border-color:#14171C\">{{ c.label }}<span style=\"color:#8A8F98\">×<\u002Fspan><\u002Fbutton>\n                <\u002Fsc-for>\n                <button sc-camel-on-click=\"{{ clearSummaryFilters }}\" style=\"cursor:pointer; font:inherit; font-size:12px; color:#1F6F5C; font-weight:600; background:transparent; border:0; padding:4px 2px\" style-hover=\"color:#14171C\">Clear all<\u002Fbutton>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n          <div style=\"overflow-x:auto\">\n            <sc-raw-table style=\"width:100%; border-collapse:collapse; font-size:13px; min-width:1040px\">\n              <sc-raw-thead>\n                <sc-raw-tr style=\"background:#FAF9F6\">\n                  <sc-raw-th style=\"text-align:left; padding:10px 20px; font-size:11px; letter-spacing:0.06em; text-transform:uppercase; color:#6B7078; font-weight:600\ low-y:auto\">\n            <sc-raw-table style=\"width:100%; border-collapse:collapse; font-size:12.5px; min-width:1220px\">\n              <sc-raw-thead>\n                <sc-raw-tr style=\"background:#FAF9F6\">\n                  <sc-for list=\"{{ issueCols }}\" as=\"h\" hint-placeholder-count=\"10\">\n                    <sc-raw-th sc-camel-on-click=\"{{ h.onClick }}\" title=\"{{ h.title }}\" style=\"text-align:left; padding:10px 10px; font-size:11px; text-transform:uppercase; letter-spacing:0.06em; font-weight:600; white-space:nowrap; cursor:{{ h.cursor }}; color:{{ h.color }}; position:sticky; top:0; z-index:2; background:#FAF9F6; box-shadow:inset 0 -1px 0 #E4E2DC\">{{ h.label }}<span style=\"font-family:'IBM Plex Mono',monospace; margin-left:5px; color:#1F6F5C\">{{ h.arrow }}<\u002Fspan><\u002Fsc-raw-th>\n                  <\u002Fsc-for>\n                <\u002Fsc-raw-tr>\n              <\u002Fsc-raw-thead>\n              <sc-raw-tbody>\n                <sc-for list=\"{{ issueRows }}\" as=\"c\" hint-placeholder-count=\"12\">\n                  <sc-raw-tr style=\"border-top:1px solid #EFEEE9\" style-hover=\"background:#FAF9F6\">\n                    <sc-raw-td style=\"padding:10px 10px; color:#6B7078\">{{ c.file }}<\u002Fsc-raw-td>\n                    <sc-raw-td style=\"padding:10px 10px; font-family:'IBM Plex Mono',monospace; font-size:11.5px; white-space:nowrap\"><div style=\"color:#8A8F98\">{{ c.rowLabel }}<\u002Fdiv><div style=\"font-weight:600; color:#14171C\">{{ c.caseLabel }}<\u002Fdiv><\u002Fsc-raw-td>\n                    <sc-raw-td style=\"padding:10px 10px; font-family:'IBM Plex Mono',monospace; font-size:11.5px\">{{ c.device }}<\u002Fsc-raw-td>\n                    <sc-raw-td style=\"padding:10px 10px\"><span style=\"display:inline-block; padding:3px 9px; border-radius:20px; font-size:11px; font-weight:600; background:{{ c.chipBg }}; color:{{ c.chipFg }}\">{{ c.result }}<\u002Fspan><\u002Fsc-raw-td>\n                    <sc-raw-td style=\"padding:1 n>\n          <\u002Fdiv>\n          <div style=\"font-size:12px; color:#1F6F5C; font-family:'IBM Plex Mono',monospace\">{{ configMsg }}<\u002Fdiv>\n        <\u002Fsection>\n\n        <section style=\"background:#fff; border:1px solid #E4E2DC; border-radius:10px; padding:20px 22px; display:flex; flex-direction:column; gap:14px\">\n          <div>\n            <h2 style=\"margin:0 0 5px; font-size:14px; font-weight:600\">Scope config (JSON)<\u002Fh2>\n            <p style=\"margin:0; font-size:12.5px; color:#6B7078; line-height:1.5\">Scopes and their result aliases, in one file. Values here drive the scope filter and the status normaliser.<\u002Fp>\n          <\u002Fdiv>\n          <textarea value=\"{{ scopeJson }}\" sc-camel-on-change=\"{{ onScopeJson }}\" spellcheck=\"false\" style=\"font-family:'IBM Plex Mono',monospace; font-size:12px; line-height:1.6; min-height:210px; padding:12px; border:1px solid #DFDDD6; border-radius:7px; background:#FAF9F6; color:#14171C; resize:vertical\"><\u002Ftextarea>\n          <div style=\"display:flex; gap:9px; align-items:center\">\n            <button sc-camel-on-click=\"{{ applyScopeJson }}\" style=\"cursor:pointer; font:inherit; font-size:13px; font-weight:600; color:#fff; background:#1F6F5C; border:0; padding:9px 16px; border-radius:7px\" style-hover=\"background:#25866F\">Apply<\u002Fbutton>\n            <span style=\"font-size:12px; font-family:'IBM Plex Mono',monospace; color:{{ scopeMsgColor }}\">{{ scopeMsg }}<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fsection>\n\n        <section style=\"background:#fff; border:1px solid #E4E2DC; border-radius:10px; padding:20px 22px; display:flex; flex-direction:column; gap:14px\">\n          <div>\n            <h2 style=\"margin:0 0 5px; font-size:14px; font-weight:600\">Clear result test<\u002Fh2>\n            <p style=\"margin:0; font-size:12.5px; color:#6B7078; line-height:1.5\">Reset every case to NYS and drop PIC, test date, ticket and note. Case list and file structure are kept.<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"background:#FAF9F6; border:1px solid #EFEEE9; border-radius:7px; padding:12px 14px; font-size:12.5px; color:#6B7078; display:flex; flex-direction:column; gap:4px\">\n            <span>Affected: <strong style=\"color:#14171C; font-family:'IBM Plex Mono',monospace\">{{ allCaseCount }}<\u002Fstrong> cases<\u002Fspan>\n            <span>Executed results lost: <strong style=\"color:#C2413A; font-family:'IBM Plex Mono',monospace\">{{ allExecutedCount }}<\u002Fstrong><\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"display:flex; gap:9px; align-items:center; flex-wrap:wrap\">\n            <button sc-camel-on-click=\"{{ clearResults }}\" style=\"cursor:pointer; font:inherit; font-size:13px; font-weight:600; color:{{ clearFg }}; background:{{ clearBg }}; border:1px solid #C2413A; padding:9px 16px; border-radius:7px\">{{ clearLabel }}<\u002Fbutton>\n            <sc-if value=\"{{ confirmClear }}\" hint-placeholder-val=\"{{ false }}\">\n              <button sc-camel-on-click=\"{{ cancelClear }}\" style=\"cursor:pointer; font:inherit; font-size:13px; color:#14171C; background:#fff; border:1px solid #DFDDD6; padding:9px 16px; border-radius:7px\">Cancel<\u002Fbutton>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fsection>\n\n        <section style=\"background:#fff; border:1px solid #E4E2DC; border-radius:10px; padding:20px 22px; display:flex; flex-direction:column; gap:12px\">\n          <h2 style=\"margin:0; font-size:14px; font-weight:600\">Import log<\u002Fh2>\n          <div style=\"display:flex; flex-direction:column; gap:8px; max-height:240px; overflow-y:auto\">\n            <sc-for list=\"{{ logRows }}\" as=\"l\" hint-placeholder-count=\"3\">\n              <div style=\"display:flex; gap:10px; font-size:12.5px; padding-bottom:8px; border-bottom:1px solid #F2F1ED\">\n                <span style=\"font-family:'IBM Plex Mono',monospace; font-size:11px; color:#6B7078; white-space:nowrap\">{{ l.time }}<\u002Fspan>\n                <span style=\"color:{{ l.color }}\">{{ l.text }}<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fsection>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n  <\u002Fmain>\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:960}}\">\nconst COLORS = { OK:'#2E7D5B', NG:'#C2413A', 'NG-OK':'#C98A2B', Pending:'#3A6EA5', Cancel:'#8A8F98', NYS:'#C6C4BD' };\nconst CHIP = { NG:['#FBEDEC','#A4332C'], 'NG-OK':['#FBF3E4','#8A5C13'], Pending:['#ECF2FA','#2C5580'], Cancel:['#F2F1ED','#61666E'], NYS:['#F2F1ED','#61666E'], OK:['#EAF3EE','#226147'] };\nconst ORDER = ['OK','NG','NG-OK','Pending','Cancel','NYS'];\nconst NONOK = ['NG','NG-OK','Pending','Cancel'];\nconst DEFAULT_CONFIG = { caseNo:'No.', caseId:'Case ID', title:'Test item', device:'Device', result:'Result', scope:'Scope', pic:'PIC', date:'Test date', ticket:'Ticket-ID', note:'Note' };\nconst DEFAULT_SCOPE_JSON = JSON.stringify({\n  scopes: [\n    { code:'FPT', label:'FPT (offshore)', members:['Tran Minh','Le Huy','Pham Anh','Nguyen Thao'] },\n    { code:'JP',  label:'JP (onsite)',    members:['K. Sato','Y. Tanaka'] }\n  ],\n  resultAliases: { OK:['ok','pass','passed','o'], NG:['ng','fail','failed','x'], 'NG-OK':['ng-ok','ngok','fixed','retest ok'], Pending:['pending','hold','blocked'], Cancel:['cancel','cancelled','n/a'], NYS:['','nys','not yet','not started'] }\n}, null, 2);\nconst EMPTY_COL = { id:'', file:'', device:'', scope:'', pic:'', date:'', ticket:'', note:'' };\n\nfunction pad(n){ return n < 10 ? '0'+n : ''+n; }\nfunction iso(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }\nfunction pct(a,b){ return b ? Math.round(a/b*1000)/10 : 0; }\n\nclass Component extends DCLogic {\n  constructor(p){\n    super(p);\n    this.state = {\n      sidebarOpen:true, view:'summary', cases: this.demo(), files: this.demoFiles(),\n      /* summary-only filters */\n      sScope:'all', sDevice:'all', sFile:'all', fileGrouping:'combined', filePage:1, filePageSize:10, fileShowAll:false,\n      /* non-OK view filters (independent) */\n      search:'', colFilters:{...EMPTY_COL}, results:[], missingOnly:false, sortKey:null, sortDir:'asc',\n      issuePage:1, issuePageSize:25, issueShowAll:false,\n      target:30, config:{...DEFAULT_CONFIG}, headerRow:1, sheetPick:'first',\n      scopeJson: DEFAULT_SCOPE_JSON, scopeCfg: JSON.parse(DEFAULT_SCOPE_JSON),\n      scopeMsg:'', scopeOk:true, configMsg:'', confirmClear:false,\n      importStatus:'Demo data loaded · 6 files',\n      log:[{ time:this.now(), text:'Demo dataset loaded (6 files)', color:'#6B7078' }]\n    };\n  }\n  now(){ const d=new Date(); return pad(d.getHours())+':'+pad(d.getMinutes()); }\n\n  demoFiles(){ return ['TC_Login_v3.xlsx','TC_Order_Entry.xlsx','TC_Payment_Gateway.xlsx','TC_Inventory_Sync.xlsx','TC_Report_Export.xlsx','TC_Admin_Settings.xlsx']; }\n  demo(){\n    const files = [\n      ['TC_Login_v3.xlsx', 180, 'Authentication'], ['TC_Order_Entry.xlsx', 340, 'Order module'],\n      ['TC_Payment_Gateway.xlsx', 265, 'Payment'], ['TC_Inventory_Sync.xlsx', 210, 'Inventory'],\n      ['TC_Report_Export.xlsx', 150, 'Reporting'], ['TC_Admin_Settings.xlsx', 120, 'Admin']\n    ];\n    const team = [['Tran Minh','FPT'],['Le Huy','FPT'],['Pham Anh','FPT'],['Nguyen Thao','FPT'],['K. Sato','JP'],['Y. Tanaka','JP']];\n    const today = new Date();\n    const days = [iso(today)]; const d = new Date(today);\n    while (days.length < 12){ d.setDate(d.getDate()-1); if (d.getDay()!==0 && d.getDay()!==6) days.unshift(iso(d)); }\n    const notes = { NG:['Validation message missing','Amount rounded incorrectly','Timeout after 30s','Layout broken on 1366px'], 'NG-OK':['Fixed in build 214, retested','Re-verified after patch'], Pending:['Waiting for test data from JP','Blocked by env down','Awaiting spec confirmation'], Cancel:['Out of scope this phase','Duplicate of previous case'] };\n    let seed = 42; const rnd = () => { seed = (seed*1103515245 + 12345) & 0x7fffffff; return seed/0x7fffffff; };\n    const out = [];\n    files.forEach(([fname,count,mod]) => {\n      const short = fname.replace('TC_','').replace('.xlsx','').replace(/_/g,'').toUpperCase().slice(0,5);\n      for (let i=1;i<=count;i++){\n        const r = rnd();\n        let result = r<0.66?'OK':r<0.735?'NG':r<0.82?'NG-OK':r<0.87?'Pending':r<0.90?'Cancel':'NYS';\n        const m = team[Math.floor(rnd()*team.length)];\n        const done = result !== 'NYS';\n        const day = days[Math.min(days.length-1, Math.floor(Math.pow(rnd(),0.75)*days.length))];\n        const unlogged = result !== 'OK' && result !== 'NYS' && rnd() < 0.13;\n        out.push({\n          id: short+'-'+pad(i), caseNo: String(i), rowNo: i+1, title: mod+' — case '+i, file: fname, result,\n          device: rnd() < 0.58 ? 'iPhone' : 'iPad',\n          scope: m[1], pic: done ? m[0] : '', date: done ? day : '',\n          ticket: (!unlogged && (result==='NG'||result==='NG-OK'||result==='Pending')) ? 'TCK-'+(1000+Math.floor(rnd()*8000)) : '',\n          note: (!unlogged && notes[result]) ? notes[result][Math.floor(rnd()*notes[result].length)] : ''\n        });\n      }\n    });\n    return out;\n  }\n\n  /* ---------- import ---------- */\n  onPickFiles = (e) => this.ingest(Array.from(e.target.files||[]));\n  onPickFolder = (e) => this.ingest(Array.from(e.target.files||[]));\n  folderRef = (el) => { if (el) { el.setAttribute('webkitdirectory',''); el.setAttribute('directory',''); } };\n\n  async ingest(fileList){\n    const wanted = fileList.filter(f => /\\.(xlsx|xls|csv)$/i.test(f.name));\n    if (!wanted.length){ this.pushLog('No .xlsx/.csv files found in selection','#C2413A'); return; }\n    if (typeof XLSX === 'undefined'){ this.pushLog('Excel reader still loading — try again in a second','#C2413A'); return; }\n    this.setState({ importStatus:'Reading '+wanted.length+' file(s)…' });\n    const cfg = this.state.config, headerRow = Math.max(1, Number(this.state.headerRow)||1);\n    const aliases = (this.state.scopeCfg && this.state.scopeCfg.resultAliases) || {};\n    const norm = (v) => {\n      const s = String(v==null?'':v).trim(); const low = s.toLowerCase();\n      for (const k of ORDER){ const list = aliases[k]||[]; if (low===k.toLowerCase() || list.some(a => String(a).toLowerCase()===low)) return k; }\n      return s ? s : 'NYS';\n    };\n    const all = [], names = [];\n    for (const f of wanted){\n      try {\n        const buf = await f.arrayBuffer();\n        const wb = XLSX.read(buf, { cellDates:true });\n        const sheets = this.state.sheetPick === 'all' ? wb.SheetNames : [wb.SheetNames[0]];\n        let n = 0;\n        sheets.forEach(sn => {\n          const rows = XLSX.utils.sheet_to_json(wb.Sheets[sn], { header:1, blankrows:false, defval:'' });\n          const head = (rows[headerRow-1]||[]).map(h => String(h).trim().toLowerCase());\n          const col = (name) => { if (!name) return -1; return head.indexOf(String(name).trim().toLowerCase()); };\n          const ix = { caseNo:col(cfg.caseNo), id:col(cfg.caseId), title:col(cfg.title), device:col(cfg.device), result:col(cfg.result), scope:col(cfg.scope), pic:col(cfg.pic), date:col(cfg.date), ticket:col(cfg.ticket), note:col(cfg.note) };\n          const get = (r,i) => i>=0 ? r[i] : '';\n          rows.slice(headerRow).forEach((r,i) => {\n            if (!r || r.every(c => String(c).trim()==='')) return;\n            const dv = get(r, ix.date);\n            all.push({\n              id: String(get(r,ix.id) || (sn+'-'+(i+1))), title: String(get(r,ix.title)||''), file: f.name,\n              caseNo: String(get(r,ix.caseNo) || (i+1)), rowNo: headerRow + i + 1,\n              device: String(get(r,ix.device)||''),\n              result: norm(get(r,ix.result)), scope: String(get(r,ix.scope)||''), pic: String(get(r,ix.pic)||''),\n              date: dv instanceof Date ? iso(dv) : String(dv||'').slice(0,10),\n              ticket: String(get(r,ix.ticket)||''), note: String(get(r,ix.note)||'')\n            });\n            n++;\n          });\n        });\n        names.push(f.name);\n        this.pushLog(f.name+' → '+n+' cases', '#2E7D5B');\n      } catch(err){ this.pushLog(f.name+' → failed: '+err.message, '#C2413A'); }\n    }\n    if (all.length) this.setState({ cases: all, files: names, sFile:'all', sScope:'all', sDevice:'all', filePage:1,\n      colFilters:{...EMPTY_COL}, results:[], search:'', importStatus: names.length+' file(s) · '+all.length+' cases' });\n    else this.setState({ importStatus:'Nothing imported — check Sheet config' });\n  }\n  pushLog(text,color){ this.setState(s => ({ log:[{time:this.now(),text,color}].concat(s.log).slice(0,40) })); }\n\n  jumpToIssues(file, device, result, scope){\n    this.setState({ view:'issues', search:'', sortKey:null,\n      colFilters:{...EMPTY_COL, file: file==='all' ? '' : file, device: device==='all' ? '' : device,\n        scope: (scope && scope!=='all') ? scope : '' },\n      missingOnly:false, results: result ? [result] : [], issuePage:1 });\n  }\n\n  summaryRows(){\n    const { cases, sScope, sDevice, sFile } = this.state;\n    return cases.filter(c => (sScope==='all'||c.scope===sScope) && (sDevice==='all'||c.device===sDevice) && (sFile==='all'||c.file===sFile));\n  }\n\n  renderVals(){\n    const s = this.state;\n    const all = s.cases;\n    const rows = this.summaryRows();\n    const counts = {}; ORDER.forEach(k => counts[k]=0);\n    rows.forEach(c => { counts[c.result] = (counts[c.result]||0)+1; });\n    const total = rows.length;\n    const executed = total - (counts.NYS||0);\n\n    const statusRows = ORDER.map(k => ({ label:k, count:counts[k]||0, pct: pct(counts[k]||0,total)+'%', color:COLORS[k] }));\n    const scopes = Array.from(new Set(all.map(c=>c.scope).filter(Boolean))).sort();\n    const pics = Array.from(new Set(all.map(c=>c.pic).filter(Boolean))).sort();\n    const devices = Array.from(new Set(all.map(c=>c.device).filter(Boolean))).sort();\n\n    /* ---- file detail rows ---- */\n    const keyName = { ng:'NG', ngok:'NG-OK', pending:'Pending', cancel:'Cancel' };\n    const cell = (n, key, file, device) => {\n      const live = n > 0;\n      const cap = key.charAt(0).toUpperCase()+key.slice(1);\n      const o = {};\n      o[key] = n;\n      o[key+'Cursor'] = live ? 'pointer' : 'default';\n      o[key+'Color'] = live ? COLORS[keyName[key]] : '#A8ACB2';\n      o[key+'Underline'] = live ? 'rgba(0,0,0,0.18)' : 'transparent';\n      o['on'+cap] = live ? () => this.jumpToIssues(file, device, keyName[key], s.sScope) : undefined;\n      return o;\n    };\n    const mkRow = (name, deviceLabel, deviceValue, sub) => {\n      const t = sub.length;\n      const c2 = {}; ORDER.forEach(k => c2[k]=sub.filter(x=>x.result===k).length);\n      return Object.assign({\n        name, device: deviceLabel, total:t, ok:c2.OK, nys:c2.NYS,\n        meta: t ? (c2.NYS ? c2.NYS+' not yet started' : 'complete') : 'no matching cases',\n        segs: ORDER.filter(k=>k!=='NYS').map(k => ({ color:COLORS[k], pct: pct(c2[k],t)+'%' })),\n        execPct: pct(t - c2.NYS, t)+'%'\n      },\n        cell(c2.NG,'ng',name,deviceValue), cell(c2['NG-OK'],'ngok',name,deviceValue),\n        cell(c2.Pending,'pending',name,deviceValue), cell(c2.Cancel,'cancel',name,deviceValue));\n    };\n    const split = s.fileGrouping === 'split';\n    let fileRows = [];\n    s.files.forEach(f => {\n      const sub = rows.filter(c => c.file===f);\n      const ds = devices.filter(d => sub.some(c => c.device===d));\n      if (split){\n        if (ds.length) ds.forEach(d => fileRows.push(mkRow(f, d, d, sub.filter(c => c.device===d))));\n        else fileRows.push(mkRow(f, '—', 'all', sub));\n      } else {\n        fileRows.push(mkRow(f, ds.length ? String(ds.length) : '—', s.sDevice, sub));\n      }\n    });\n    fileRows = fileRows.filter(f => f.total > 0 || s.sFile==='all');\n\n    const size = Math.max(1, Number(s.filePageSize)||10);\n    const pageCount = Math.max(1, Math.ceil(fileRows.length/size));\n    const page = Math.min(Math.max(1, s.filePage), pageCount);\n    const filePageRows = s.fileShowAll ? fileRows : fileRows.slice((page-1)*size, page*size);\n\n    /* ---- today, by file ---- */\n    const todayIso = iso(new Date());\n    const todayList = rows.filter(c => c.date === todayIso);\n    const todayFiles = Array.from(new Set(todayList.map(c => c.file)));\n    const todayRows = todayFiles.map(f => {\n      const sub = todayList.filter(c => c.file===f);\n      const names = Array.from(new Set(sub.map(c => c.pic).filter(Boolean)));\n      const c2 = {}; ORDER.forEach(k => c2[k]=sub.filter(x=>x.result===k).length);\n      return {\n        file: f, total: sub.length,\n        pics: names.slice(0,3).join(' / ') + (names.length>3 ? ' +'+(names.length-3) : ''),\n        chips: ORDER.filter(k => k!=='NYS').map(k => ({ label: k+' '+c2[k], bg:(CHIP[k]||CHIP.Cancel)[0], fg:(CHIP[k]||CHIP.Cancel)[1] }))\n      };\n    }).sort((a,b) => b.total-a.total);\n\n    /* ---- days (whole dataset) ---- */\n    const byDay = {};\n    all.forEach(c => { if (!c.date) return; (byDay[c.date] = byDay[c.date] || []).push(c); });\n    const dayKeys = Object.keys(byDay).sort();\n    const plan = Math.max(1, (Number(s.target)||30) * Math.max(1, pics.length));\n    const max = Math.max(plan, ...dayKeys.map(k => byDay[k].length), 1) * 1.12;\n    const allExecuted = all.filter(c => c.result !== 'NYS').length;\n    let cum = 0;\n    const dayRows = dayKeys.map(k => {\n      const list = byDay[k]; cum += list.length;\n      const a = pct(list.length, plan);\n      return { date:k, count:list.length, plan, attain:a+'%', color: a>=100?'#2E7D5B':a>=80?'#C98A2B':'#C2413A',\n        ng: list.filter(c=>c.result==='NG').length, members: new Set(list.map(c=>c.pic)).size,\n        cum, cumPct: pct(cum, all.length)+'%' };\n    });\n    const dayBars = dayRows.map(d => ({ label: d.date.slice(5), count:d.count, color:'#1F6F5C',\n      trackH:'100%', barH: pct(d.count, max)+'%', planBottom: pct(plan, max)+'%' }));\n    const latest = dayKeys.length ? dayKeys[dayKeys.length-1] : '';\n\n    /* ---- members (whole dataset) ---- */\n    const memberRows = pics.map(p => {\n      const sub = all.filter(c => c.pic===p);\n      const days = new Set(sub.map(c=>c.date).filter(Boolean)).size || 1;\n      const avg = Math.round(sub.length/days*10)/10;\n      const a = pct(avg, Number(s.target)||30);\n      return { pic:p, total:sub.length, days, avg,\n        ngRate: pct(sub.filter(c=>c.result==='NG'||c.result==='NG-OK').length, sub.length)+'%',\n        attain: a+'%', attainW: Math.min(100,a)+'%', color: a>=100?'#2E7D5B':a>=80?'#C98A2B':'#C2413A' };\n    }).sort((a,b) => b.total-a.total);\n\n    const heatDays = dayKeys.map(k => ({ label:k.slice(5) }));\n    const heatMax = Math.max(1, ...pics.map(p => Math.max(0, ...dayKeys.map(k => byDay[k].filter(c=>c.pic===p).length))));\n    const heatRows = pics.map(p => ({ pic:p, cells: dayKeys.map(k => {\n      const n = byDay[k].filter(c=>c.pic===p).length; const r = n/heatMax;\n      return { n: n||'', title: p+' · '+k+' · '+n+' cases',\n        bg: n===0 ? '#F7F6F3' : 'rgba(31,111,92,'+(0.12+r*0.75).toFixed(2)+')',\n        fg: r>0.55 ? '#fff' : '#14171C' };\n    }) }));\n\n    /* ---- non-OK view ---- */\n    const nonOkAll = all.filter(c => c.result!=='OK' && c.result!=='NYS');\n    const cf = s.colFilters, res = s.results;\n    const hit = (val, f) => !f || String(val||'').toLowerCase().includes(String(f).toLowerCase());\n    const q = s.search.trim().toLowerCase();\n    const passConditions = (c) => (!q || (c.id+' '+c.caseNo+' '+c.title+' '+c.ticket+' '+c.note+' '+c.pic).toLowerCase().includes(q))\n      && hit(c.id, cf.id) && (!cf.file || c.file===cf.file) && (!cf.device || c.device===cf.device)\n      && (!cf.scope || c.scope===cf.scope) && (!cf.pic || c.pic===cf.pic)\n      && (!cf.date || c.date===cf.date) && hit(c.ticket, cf.ticket) && hit(c.note, cf.note)\n      && (!s.missingOnly || (!String(c.ticket||'').trim() && !String(c.note||'').trim()));\n    const conditioned = nonOkAll.filter(passConditions);\n    let issueAll = conditioned.filter(c => res.length===0 || res.indexOf(c.result)>=0);\n    if (s.sortKey){\n      const dir = s.sortDir === 'desc' ? -1 : 1, key = s.sortKey;\n      issueAll = issueAll.slice().sort((a,b) => {\n        if (key==='result') return (ORDER.indexOf(a.result)-ORDER.indexOf(b.result))*dir;\n        if (key==='caseNo') return ((Number(a.rowNo)||0)-(Number(b.rowNo)||0))*dir;\n        return String(a[key]||'').localeCompare(String(b[key]||''))*dir;\n      });\n    } else {\n      issueAll = issueAll.slice().sort((a,b) => ORDER.indexOf(a.result)-ORDER.indexOf(b.result) || (b.date||'').localeCompare(a.date||''));\n    }\n    const iSize = Math.max(1, Number(s.issuePageSize)||25);\n    const iPageCount = Math.max(1, Math.ceil(issueAll.length/iSize));\n    const iPage = Math.min(Math.max(1, s.issuePage), iPageCount);\n    const issueSlice = s.issueShowAll ? issueAll : issueAll.slice((iPage-1)*iSize, iPage*iSize);\n    const issueRows = issueSlice.map((c) => {\n      const miss = !String(c.ticket||'').trim() && !String(c.note||'').trim();\n      return { ...c,\n        rowLabel: 'row ' + (c.rowNo!=null ? pad(Number(c.rowNo)||0) : '—'),\n        caseLabel: 'case ' + ((c.caseNo!=null && c.caseNo!=='') ? (Number(c.caseNo) ? pad(Number(c.caseNo)) : c.caseNo) : (c.id||'—')),\n        pic: c.pic||'—', date: c.date||'—', device: c.device||'—', ticket: c.ticket||'—', note: c.note||'—', scope: c.scope||'—',\n        missBg: miss ? '#FBEDEC' : 'transparent', missFg: miss ? '#A4332C' : '#1F6F5C', missNoteFg: miss ? '#A4332C' : '#6B7078',\n        chipBg: (CHIP[c.result]||CHIP.Cancel)[0], chipFg: (CHIP[c.result]||CHIP.Cancel)[1] };\n    });\n\n    const sortCol = (key, label) => ({ label, title:'Sort by '+label, cursor:'pointer',\n      color: s.sortKey===key ? '#14171C' : '#6B7078',\n      arrow: s.sortKey===key ? (s.sortDir==='asc' ? '↑' : '↓') : '',\n      onClick: () => this.setState(st => ({ sortKey:key, sortDir: st.sortKey===key && st.sortDir==='asc' ? 'desc' : 'asc' })) });\n    const issueCols = [ sortCol('file','File'), sortCol('caseNo','Row / Case'), sortCol('device','Device'), sortCol('result','Result'),\n      sortCol('scope','Scope'), sortCol('pic','PIC'), sortCol('date','Date'), sortCol('ticket','Ticket'), sortCol('note','Note') ];\n\n    const setCf = (k) => (e) => { const v = e.target.value; this.setState(st => ({ colFilters:{...st.colFilters,[k]:v}, issuePage:1 })); };\n    const none = { isSelect:false, isText:false, isDate:false, isResults:false };\n    const sel = (k, allLabel, list) => ({ ...none, isSelect:true, value: cf[k], onChange: setCf(k),\n      options: [{v:'',label:allLabel}].concat(list.map(x=>({v:x,label:x}))) });\n    const txt = (k, placeholder) => ({ ...none, isText:true, value: cf[k], onChange: setCf(k), placeholder });\n    const toggleRes = (v) => () => this.setState(st => ({ issuePage:1, results: st.results.indexOf(v)>=0 ? st.results.filter(x=>x!==v) : st.results.concat([v]) }));\n    const resultCell = { ...none, isResults:true, items: NONOK.map(v => {\n      const on = res.indexOf(v)>=0;\n      return { label: v, onClick: toggleRes(v), border: on ? COLORS[v] : '#E4E2DC',\n        bg: on ? (CHIP[v]||CHIP.Cancel)[0] : '#fff', fg: on ? (CHIP[v]||CHIP.Cancel)[1] : '#6B7078' };\n    }) };\n    const issueFilterControls = [\n      { ...sel('file','all files', s.files), label:'File' },\n      { ...txt('id','case no'), label:'Case' },\n      { ...sel('device','all', devices), label:'Device' },\n      { ...sel('scope','all', scopes), label:'Scope' },\n      { ...sel('pic','all', pics), label:'PIC' },\n      { ...none, isDate:true, label:'Date', value: cf.date, onChange: setCf('date') },\n      { ...txt('ticket','TCK-'), label:'Ticket' },\n      { ...txt('note','contains'), label:'Note' }\n    ];\n\n    const chip = (label, onClear) => ({ label, onClear });\n    const issueChips = [\n      cf.file ? chip(cf.file, () => this.setState(st => ({ colFilters:{...st.colFilters, file:''} }))) : null,\n      cf.device ? chip(cf.device, () => this.setState(st => ({ colFilters:{...st.colFilters, device:''} }))) : null,\n      res.length ? chip('Result · '+res.join(', '), () => this.setState({ results:[] })) : null,\n      cf.scope ? chip('Scope · '+cf.scope, () => this.setState(st => ({ colFilters:{...st.colFilters, scope:''} }))) : null,\n      cf.pic ? chip('PIC · '+cf.pic, () => this.setState(st => ({ colFilters:{...st.colFilters, pic:''} }))) : null,\n      cf.date ? chip('Date · '+cf.date, () => this.setState(st => ({ colFilters:{...st.colFilters, date:''} }))) : null,\n      cf.id ? chip('Case · '+cf.id, () => this.setState(st => ({ colFilters:{...st.colFilters, id:''} }))) : null,\n      cf.ticket ? chip('Ticket · '+cf.ticket, () => this.setState(st => ({ colFilters:{...st.colFilters, ticket:''} }))) : null,\n      cf.note ? chip('Note · '+cf.note, () => this.setState(st => ({ colFilters:{...st.colFilters, note:''} }))) : null,\n      s.missingOnly ? chip('Missing ticket & note', () => this.setState({ missingOnly:false })) : null\n    ].filter(Boolean);\n\n    const tabDefs = [['all','All non-OK']].concat(NONOK.map(v => [v,v]));\n    const issueTabs = tabDefs.map(([v,label]) => {\n      const isAll = v==='all';\n      const activeTab = isAll ? res.length===0 : (res.length===1 && res[0]===v);\n      return { label, count: isAll ? conditioned.length : conditioned.filter(c=>c.result===v).length,\n        color: isAll ? '#14171C' : COLORS[v], border: activeTab ? (isAll?'#14171C':COLORS[v]) : '#E4E2DC',\n        onClick: () => this.setState({ results: isAll ? [] : [v], issuePage:1 }) };\n    });\n\n    const titles = { summary:['Summary','Overview of every test case file'], daily:['Daily Tracking','Cases executed per day against plan'],\n      team:['Productivity','Team and per-member throughput'], issues:['Non-OK cases','Every case not passing, grouped and searchable'], tools:['Tools','Configuration and maintenance'] };\n    const t = titles[s.view];\n    const active = '#242931';\n    const cfgLabels = [['caseNo','No.'],['caseId','Case ID'],['title','Test item'],['device','Device'],['result','Result'],['scope','Scope'],['pic','PIC'],['date','Test date'],['ticket','Ticket-ID'],['note','Note']];\n\n    return {\n      sidebarOpen: s.sidebarOpen !== false, railClosed: s.sidebarOpen === false,\n      gridCols: s.sidebarOpen === false ? '64px' : '236px',\n      toggleSidebar: () => this.setState(st => ({ sidebarOpen: st.sidebarOpen === false })),\n      todayLabel: todayIso,\n      todayExec: todayList.length ? todayList.length + ' cases executed today' : (latest ? 'no activity · last: ' + latest : 'no activity yet'),\n      navSummary: s.view==='summary'?active:'transparent', navDaily: s.view==='daily'?active:'transparent',\n      navTeam: s.view==='team'?active:'transparent', navIssues: s.view==='issues'?active:'transparent', navTools: s.view==='tools'?active:'transparent',\n      goSummary:()=>this.setState({view:'summary'}), goDaily:()=>this.setState({view:'daily'}),\n      goTeam:()=>this.setState({view:'team'}), goIssues:()=>this.setState({view:'issues'}), goTools:()=>this.setState({view:'tools'}),\n      isSummary: s.view==='summary', isDaily: s.view==='daily', isTeam: s.view==='team', isIssues: s.view==='issues', isTools: s.view==='tools',\n      viewTitle: t[0], viewSub: t[1],\n      totalCases: total.toLocaleString(), nonOkCount: nonOkAll.length,\n      allCaseCount: all.length.toLocaleString(), allExecutedCount: allExecuted.toLocaleString(),\n      importStatus: s.importStatus,\n      onPickFiles: this.onPickFiles, onPickFolder: this.onPickFolder, folderRef: this.folderRef,\n\n      scopeFilter: s.sScope, fileFilter: s.sFile, deviceFilter: s.sDevice,\n      scopeOptions: [{v:'all',label:'All scopes'}].concat > ({ missingOnly: !st.missingOnly, issuePage:1 })),\n      missingBorder: s.missingOnly ? '#C2413A' : '#DFDDD6',\n      missingBg: s.missingOnly ? '#FBEDEC' : '#fff',\n      missingFg: s.missingOnly ? '#A4332C' : '#6B7078',\n      hasIssueFilters: issueChips.length > 0,\n      search: s.search, onSearch: e => this.setState({ search:e.target.value, issuePage:1 }),\n      issuePaged: !s.issueShowAll && iPageCount > 1,\n      issuePageLabel: iPage+' / '+iPageCount,\n      issuePrev: () => this.setState(st => ({ issuePage: Math.max(1, st.issuePage-1) })),\n      issueNext: () => this.setState({ issuePage: Math.min(iPageCount, iPage+1) }),\n      toggleIssueShowAll: () => this.setState(st => ({ issueShowAll: !st.issueShowAll, issuePage:1 })),\n      issueShowAllLabel: s.issueShowAll ? 'Paginate · 25 / page' : 'Show all rows',\n      issueRangeLabel: issueAll.length === 0 ? 'no rows'\n        : (s.issueShowAll ? issueAll.length+' rows' : 'rows '+((iPage-1)*iSize+1)+'–'+Math.min(iPage*iSize, issueAll.length)+' of '+issueAll.length),\n      clearColFilters: () => this.setState({ colFilters:{...EMPTY_COL}, results:[], missingOnly:false, search:'', sortKey:null, issuePage:1 }),\n      issueCountLabel: 'showing '+issueRows.length+' of '+issueAll.length,\n\n      configFields: cfgLabels.map(([k,label]) => ({ label, value: s.config[k],\n        onChange: e => { const v = e.target.value; this.setState(st => ({ config:{...st.config,[k]:v}, configMsg:'' })); } })),\n      headerRow: s.headerRow, onHeaderRow: e => this.setState({ headerRow:e.target.value }),\n      sheetPick: s.sheetPick, onSheetPick: e => this.setState({ sheetPick: e.target.value.trim().toLowerCase()==='all' ? 'all' : 'first' }),\n      saveConfig: () => { this.setState({ configMsg:'Config saved — applies to the next import' }); this.pushLog('Sheet config updated','#6B7078'); },\n      resetConfig: () => this.setState({ config:{...DEFAULT_CONFIG}, headerRow:1, sheetPick:'first', configMsg:'Reset to default' }),\n
