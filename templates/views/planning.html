        <!-- ==================== Planning ====================
             The phase, what each day hands out, and how it is going. The Day
             plan is the only part that edits — a cell opens the slot editor —
             while the burndown and the phase grid report on it. Everything
             here is filled by views/planning/render.js. -->
        <section class="view" id="planningView" hidden>
            <div class="plan-phase" id="planPhase"></div>
            <p class="empty-note is-error" id="planPhaseError" hidden></p>
            <div class="kpis plan-kpis" id="planKpis"></div>

            <section class="card card--table" id="day-plan">
                <div class="card-head card-head--row plan-day-head" id="planDayHead"></div>
                <p class="empty-note is-error" id="planDayError" hidden></p>
                <p class="card-note plan-note" id="planUnplannedNote" hidden></p>
                <div class="scroll-x plan-matrix-pane" id="planMatrix"></div>
                <div class="scroll-x scroll-x--rows" id="planList" hidden></div>
            </section>

            <section class="card" id="planBurn">
                <div class="card-head card-head--row" id="planBurnHead"></div>
                <div class="plan-burn" id="planBurnChart"></div>
                <p class="card-note" id="planBurnNote"></p>
            </section>

            <section class="card card--table" id="planGrid">
                <div class="card-head card-head--row" id="planGridHead"></div>
                <div class="scroll-x" id="planGridTable"></div>
            </section>

            <!-- Phases and who is in them. The active phase is the one every
                 plan figure in the app reads. Filled by views/planning/phases.js. -->
            <section class="card" id="planPhases">
                <div class="card-head card-head--row"><h2>Phases &amp; members</h2></div>
                <p class="empty-note is-error" id="planPhasesError" hidden></p>
                <div class="scroll-x"><table class="ledger" id="planPhaseTable"></table></div>
                <div class="row plan-phase-new">
                    <input type="text" class="input" id="planNewPhaseName" placeholder="New phase name"
                           aria-label="New phase name">
                    <button type="button" class="btn" data-act="create-phase">Add phase</button>
                </div>
                <h3 class="plan-members-head" id="planMembersHead">Members</h3>
                <div class="checks" id="planMembers"></div>
                <div class="row plan-member-new">
                    <input type="text" class="input" id="planNewMember" placeholder="Add a member by name"
                           aria-label="New member name">
                    <button type="button" class="btn" data-act="add-member">Add</button>
                </div>
                <div class="plan-suggestions" id="planSuggestions"></div>
            </section>

            <div class="plan-tip" id="planTip" role="tooltip" hidden></div>

            <dialog class="plan-editor" id="planEditor" aria-labelledby="planEditorTitle"></dialog>
        </section>
